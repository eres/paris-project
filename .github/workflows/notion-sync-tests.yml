name: Notre Paris Notion Sync Tests

on:
  pull_request:
    paths:
      - "**.py"
      - ".github/workflows/notion-sync-tests.yml"
  push:
    branches:
      - feat/notre-paris-notion-sync-20261119

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lightweight unit-test dependencies
        run: python -m pip install httpx PyYAML watchdog python-dotenv
      - name: Syntax check
        run: python -m compileall -q sync_notion.py watch_vault.py tests
      - name: Unit tests (no Notion credentials required)
        run: python -m unittest discover -s tests -v
