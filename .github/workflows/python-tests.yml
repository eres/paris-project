name: Python unit tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight test dependencies
        run: python -m pip install markdown-it-py PyYAML watchdog python-dotenv
      - name: Check Python syntax
        run: python -m compileall -q publish_to_notion.py watch_vault.py tests
      - name: Run unit tests (no Notion writes or model calls)
        run: python -m unittest discover -s tests -v
